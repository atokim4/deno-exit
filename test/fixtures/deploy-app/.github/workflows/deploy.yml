name: Deploy
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - run: deno test -A
      - uses: denoland/deployctl@v1
        with:
          project: sample-notes
          entrypoint: main.ts
